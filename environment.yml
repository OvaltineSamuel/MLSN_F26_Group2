# Conda environment for the MLSN Group 2 CRISPR project.
#
#   conda env create -f environment.yml
#   conda activate mlsn-group-2
#
# To refresh an existing env:   conda env update -f environment.yml --prune
#
# Python note: we pin 3.11 because the gradient-boosting libraries
# (lightgbm / xgboost / catboost) have reliable pre-built wheels there. Python
# 3.14 is very new and some of these may not have wheels yet; if you must use
# 3.14, the modelling notebook will simply skip any library that fails to import.
name: mlsn-group-2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - scipy>=1.10
  - openpyxl>=3.1
  - matplotlib>=3.7
  - seaborn>=0.12
  - joblib>=1.3
  - lightgbm>=4.0
  - xgboost>=2.0
  - jupyter>=1.0
  - ipykernel>=6.25
  # deep-learning stack: torch from conda-forge (NOT pip) so it shares conda's single OpenMP runtime
  - pytorch>=2.1
  - biopython>=1.82
  - optuna>=3.5
  - pip
  - pip:
      # catboost is distributed most reliably via pip
      - catboost>=1.2
      - ViennaRNA
